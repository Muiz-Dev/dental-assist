server.port=8080
spring.application.name=dentassist-backend

# H2 / Mock DB setup for fast context test if needed or Testcontainers
spring.datasource.url=jdbc:h2:mem:dentassist_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Flyway disabled for unit test profile unless specified
spring.flyway.enabled=false

# Disable redis auto-configuration for context load test if desired
spring.data.redis.repositories.enabled=false
