server.port=${SERVER_PORT:8080}

spring.application.name=dentassist-backend

# Datasource configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dentassist_dev}
spring.datasource.username=${DB_USERNAME:dentassist_user}
spring.datasource.password=${DB_PASSWORD:dentassist_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Actuator & Management
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
